<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mes Liens | Bstudio136</title>
  <!-- FontAwesome pour les icônes réelles -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    /* --- VARIABLES & THÈMES --- */
    :root {
      --bg-gradient-1: #0f0c29;
      --bg-gradient-2: #302b63;
      --bg-gradient-3: #24243e;
      --bg-gradient-4: #2b1b16;
      --card-bg: rgba(12, 16, 30, 0.95);
      --card-border: #FFD700;
      --text-main: #ffffff;
      --text-sub: #b0b0c0;
      
      --btn-bg: linear-gradient(135deg, rgba(12, 16, 30, 0.95) 0%, rgba(74, 0, 224, 0.8) 50%, rgba(142, 45, 226, 0.8) 100%);
      --btn-border: #FFD700;
      --btn-hover-border: #FFF8DC;
      
      --glow-gold: rgba(255, 215, 0, 0.6);
      --glow-purple: rgba(142, 45, 226, 0.6);
      --shadow-3d: 0 15px 40px rgba(0,0,0,0.9), 0 0 25px rgba(255, 215, 0, 0.3), inset 0 0 20px rgba(255, 215, 0, 0.15);
      --btn-shadow: 0 0 20px rgba(255, 215, 0, 0.3), inset 0 0 25px rgba(142, 45, 226, 0.5);
      --btn-shadow-hover: 0 20px 50px rgba(142, 45, 226, 0.8), 0 0 40px rgba(255, 215, 0, 0.6), inset 0 0 35px rgba(255, 215, 0, 0.3);
    }

    [data-theme="light"] {
      --bg-gradient-1: #e0eafc;
      --bg-gradient-2: #cfdef3;
      --bg-gradient-3: #ffffff;
      --bg-gradient-4: #fdf6e3;
      --card-bg: rgba(255, 255, 255, 0.9);
      --card-border: #D4AF37;
      --text-main: #1a1a2e;
      --text-sub: #555566;
      
      --btn-bg: linear-gradient(135deg, rgba(30, 20, 60, 0.95) 0%, rgba(74, 0, 224, 0.9) 100%);
      --btn-border: #D4AF37;
      --btn-hover-border: #FFD700;
      
      --glow-gold: rgba(212, 175, 55, 0.4);
      --glow-purple: rgba(74, 0, 224, 0.4);
      --shadow-3d: 0 15px 40px rgba(0,0,0,0.2), 0 0 25px rgba(212, 175, 55, 0.2);
      --btn-shadow: 0 0 20px rgba(212, 175, 55, 0.2), inset 0 0 25px rgba(74, 0, 224, 0.4);
      --btn-shadow-hover: 0 20px 50px rgba(74, 0, 224, 0.5), 0 0 40px rgba(212, 175, 55, 0.5);
    }

    /* --- RESET & BASE --- */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(-45deg, var(--bg-gradient-1), var(--bg-gradient-2), var(--bg-gradient-3), var(--bg-gradient-4));
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      transition: color 0.3s;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* --- CARTE PRINCIPALE --- */
    .container {
      width: 100%;
      max-width: 480px;
      background: var(--card-bg);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border-radius: 16px;
      padding: 40px 25px 30px;
      border: 2px solid var(--card-border);
      box-shadow: var(--shadow-3d);
      text-align: center;
      position: relative;
      transition: background 0.3s, border 0.3s, box-shadow 0.3s;
      overflow: hidden;
      animation: fadeInUp 0.8s ease-out forwards;
      clip-path: polygon(0 0, calc(100% - 20px) 0, 100% 20px, 100% 100%, 20px 100%, 0 calc(100% - 20px));
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* --- BOUTON THEME --- */
    .theme-toggle {
      position: absolute;
      top: 20px;
      right: 20px;
      background: var(--btn-bg);
      border: 1.5px solid var(--btn-border);
      color: var(--text-main);
      width: 45px;
      height: 45px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      transition: all 0.3s ease;
      z-index: 10;
      box-shadow: var(--btn-shadow);
    }
    .theme-toggle:hover {
      transform: scale(1.1) rotate(15deg);
      box-shadow: var(--btn-shadow-hover);
      border-color: var(--btn-hover-border);
    }

    /* --- AVATAR --- */
    .avatar-wrapper {
      position: relative;
      width: 120px;
      height: 120px;
      margin: 0 auto 20px;
      border-radius: 50%;
      padding: 5px;
      background: linear-gradient(45deg, var(--card-border), #FFA500, var(--card-border));
      box-shadow: 0 0 30px var(--glow-gold);
      animation: pulseGlow 3s infinite alternate;
      opacity: 0;
      animation: fadeInUp 0.8s ease-out 0.2s forwards, pulseGlow 3s infinite alternate 0.8s;
    }
    @keyframes pulseGlow {
      0% { box-shadow: 0 0 15px var(--glow-gold); }
      100% { box-shadow: 0 0 50px var(--glow-purple), 0 0 25px var(--glow-gold); }
    }
    .avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      background: #121212;
      border: 2px solid #000;
      transition: transform 0.3s ease;
    }
    .avatar:hover {
      transform: scale(1.05);
    }

    /* --- TEXTES --- */
    h1 {
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 5px;
      background: linear-gradient(45deg, var(--card-border), #FFF8DC, var(--card-border));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      opacity: 0;
      animation: fadeInUp 0.8s ease-out 0.3s forwards;
      text-shadow: 0 2px 15px rgba(255, 215, 0, 0.5);
    }
    .username {
      color: var(--text-sub);
      font-size: 0.95rem;
      margin-bottom: 15px;
      font-weight: 500;
      opacity: 0;
      animation: fadeInUp 0.8s ease-out 0.4s forwards;
    }
    .bio {
      font-size: 0.95rem;
      line-height: 1.6;
      color: var(--text-sub);
      margin-bottom: 25px;
      padding: 0 10px;
      opacity: 0;
      animation: fadeInUp 0.8s ease-out 0.5s forwards;
    }

    /* --- TITRES DE SECTION --- */
    .section-title {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 3px;
      color: var(--card-border);
      margin: 25px 0 15px 0;
      font-weight: 700;
      opacity: 0;
      animation: fadeInUp 0.8s ease-out 0.6s forwards;
      text-shadow: 0 0 15px var(--glow-gold);
    }

    /* --- LIENS ET EFFETS 3D --- */
    .links {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    
    .link {
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 12px 20px;
      background: var(--btn-bg);
      border: 1.5px solid var(--btn-border);
      color: var(--text-main);
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 1rem;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      position: relative;
      overflow: hidden;
      cursor: pointer;
      clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 12px 100%, 0 calc(100% - 12px));
      box-shadow: var(--btn-shadow);
      animation: fadeInUp 0.6s ease-out forwards, cardFloat 6s ease-in-out infinite;
      transform-style: preserve-3d;
    }
    
    /* Délais d'animation pour les liens standards */
    .link:nth-child(1) { animation-delay: 0.7s, 0s; }
    .link:nth-child(2) { animation-delay: 0.8s, 0.5s; }
    .link:nth-child(3) { animation-delay: 0.9s, 1s; }
    .link:nth-child(4) { animation-delay: 1.0s, 1.5s; }
    .link:nth-child(5) { animation-delay: 1.1s, 2s; }
    .link:nth-child(6) { animation-delay: 1.2s, 2.5s; }
    .link:nth-child(7) { animation-delay: 1.3s, 3s; }

    @keyframes cardFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }

    /* --- RAYON LUMINEUX PLUS BRILLANT ET 3D --- */
    .link::after {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 100%; height: 100%;
      background: linear-gradient(90deg, 
                  transparent 0%, 
                  rgba(255, 215, 0, 0.3) 30%, 
                  rgba(255, 255, 255, 0.95) 50%, 
                  rgba(255, 215, 0, 0.3) 70%, 
                  transparent 100%);
      animation: cardSweep 4s ease-in-out infinite;
      pointer-events: none;
      z-index: 1;
      mix-blend-mode: screen;
      filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.9));
    }
    
    /* Stagger le balayage */
    .link:nth-child(1)::after { animation-delay: 0s; }
    .link:nth-child(2)::after { animation-delay: 0.7s; }
    .link:nth-child(3)::after { animation-delay: 1.4s; }
    .link:nth-child(4)::after { animation-delay: 2.1s; }
    .link:nth-child(5)::after { animation-delay: 2.8s; }
    .link:nth-child(6)::after { animation-delay: 3.5s; }
    .link:nth-child(7)::after { animation-delay: 4.2s; }

    @keyframes cardSweep {
      0% { left: -100%; }
      50%, 100% { left: 100%; }
    }

    /* Effet de survol 3D */
    .link:hover {
      transform: translateY(-8px) scale(1.03);
      border-color: var(--btn-hover-border);
      box-shadow: var(--btn-shadow-hover);
      animation-play-state: paused;
      background: linear-gradient(135deg, rgba(74, 0, 224, 0.95) 0%, rgba(142, 45, 226, 0.95) 100%);
    }

    /* --- NOUVELLE ANIMATION AU CLIC (PRESS DOWN) --- */
    .link.pressed {
      transform: perspective(1000px) rotateX(0deg) rotateY(0deg) scale(0.95) translateY(-2px) !important;
      box-shadow: 0 0 60px rgba(255, 215, 0, 0.9), inset 0 0 40px rgba(142, 45, 226, 0.9) !important;
      transition: all 0.1s cubic-bezier(0.4, 0, 0.2, 1) !important;
      animation-play-state: paused;
    }

    /* --- ANNEAU NÉON AU CLIC --- */
    .click-ring {
      position: absolute;
      border-radius: 50%;
      border: 3px solid #FFD700;
      box-shadow: 0 0 20px #FFD700, inset 0 0 20px #FFD700, 0 0 40px #FFF;
      transform: scale(0);
      animation: ring-anim 0.6s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
      pointer-events: none;
      z-index: 4;
      mix-blend-mode: screen;
    }
    @keyframes ring-anim {
      0% { transform: scale(0); opacity: 1; }
      100% { transform: scale(3); opacity: 0; }
    }

    /* --- ICÔNES 3D RÉELLES --- */
    .link .icon {
      font-size: 1.4rem;
      width: 45px;
      height: 45px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%; /* Cercle parfait */
      border: 1.5px solid #FFD700; /* Bordure dorée conservée */
      box-shadow: 
        0 4px 10px rgba(0,0,0,0.6),
        inset 0 2px 5px rgba(255,255,255,0.4),
        inset 0 -3px 8px rgba(0,0,0,0.8),
        0 0 15px rgba(255, 215, 0, 0.5);
      color: #FFD700; /* Icône dorée */
      text-shadow: 
        0 1px 0 #FFF, 
        0 2px 0 #B8860B, 
        0 3px 6px rgba(0,0,0,0.8);
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      transform: perspective(500px) rotateY(0deg);
      z-index: 2;
    }
    
    .link:hover .icon {
      transform: perspective(500px) rotateY(10deg) scale(1.1);
      box-shadow: 
        0 6px 15px rgba(255, 215, 0, 0.6),
        inset 0 2px 5px rgba(255,255,255,0.5),
        inset 0 -3px 6px rgba(0,0,0,0.8),
        0 0 25px rgba(255, 215, 0, 0.8);
      color: #FFF8DC;
    }

    /* Effet sur le texte */
    .link .text {
      transition: letter-spacing 0.3s ease, text-shadow 0.3s ease;
      z-index: 2;
      flex-grow: 1;
      text-align: left;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    }
    .link:hover .text {
      letter-spacing: 1px;
      text-shadow: 0 0 15px #FFF, 0 0 30px var(--glow-gold);
    }

    /* --- ACCORDÉON PROJETS --- */
    .arrow {
      font-size: 0.8rem;
      transition: transform 0.4s ease;
      z-index: 2;
      color: var(--card-border);
      text-shadow: 0 0 10px var(--glow-gold);
    }
    .accordion-toggle.open .arrow {
      transform: rotate(180deg);
      color: #FFF;
    }
    .projects-list {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.5s cubic-bezier(0, 1, 0, 1), opacity 0.5s ease, margin-top 0.5s ease;
      opacity: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-left: 15px;
      border-left: 2px solid var(--card-border);
      margin-left: 15px;
      text-align: left;
    }
    .projects-list.open {
      max-height: 1000px;
      opacity: 1;
      transition: max-height 0.5s ease-in-out, opacity 0.5s ease, margin-top 0.5s ease;
      margin-top: 10px;
    }
    
    .sub-link {
      padding: 10px 15px;
      font-size: 0.9rem;
      border-radius: 6px;
      border-width: 1px;
      clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 8px 100%, 0 calc(100% - 8px));
      animation: none;
      background: linear-gradient(135deg, rgba(12, 16, 30, 0.9) 0%, rgba(74, 0, 224, 0.6) 100%);
    }
    .sub-link:hover {
      transform: translateX(5px) scale(1.01);
      animation: none;
    }
    .sub-link .icon {
      font-size: 1.1rem;
      width: 35px;
      height: 35px;
    }

    /* --- GRILLE DES RÉSEAUX SOCIAUX --- */
    .social-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      justify-items: center;
      margin-bottom: 25px;
    }
    
    .link.social-link {
      width: 100%;
      height: auto;
      padding: 12px 5px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      border-radius: 12px;
      clip-path: none;
      animation: fadeInUp 0.6s ease-out forwards, cardFloat 6s ease-in-out infinite;
    }
    
    /* Délais d'animation pour la grille sociale */
    .social-grid .social-link:nth-child(1) { animation-delay: 0.7s, 0s; }
    .social-grid .social-link:nth-child(2) { animation-delay: 0.8s, 0.5s; }
    .social-grid .social-link:nth-child(3) { animation-delay: 0.9s, 1s; }
    .social-grid .social-link:nth-child(4) { animation-delay: 1.0s, 1.5s; }
    .social-grid .social-link:nth-child(5) { animation-delay: 1.1s, 2s; }
    .social-grid .social-link:nth-child(6) { animation-delay: 1.2s, 2.5s; }

    /* --- PERSONNALISATION DES FONDS DE CERCLES (COULEURS DE MARQUE) --- */
    .social-github .icon { 
      background: linear-gradient(135deg, #24292e 0%, #000000 100%); 
    }
    .social-tiktok .icon { 
      background: linear-gradient(135deg, #000000 0%, #25F4EE 100%); 
    }
    .social-twitter .icon { 
      background: linear-gradient(135deg, #000000 0%, #1a1a1a 100%); 
    }
    .social-facebook .icon { 
      background: linear-gradient(135deg, #1877F2 0%, #0a4da3 100%); 
    }
    .social-instagram .icon { 
      background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); 
    }
    .social-youtube .icon { 
      background: linear-gradient(135deg, #FF0000 0%, #8b0000 100%); 
    }

    .link.social-link .icon {
      width: 45px;
      height: 45px;
      font-size: 1.5rem;
    }
    
    .link.social-link:hover .icon {
      transform: perspective(500px) rotateY(0deg) scale(1.1);
    }

    /* --- NOM DU RÉSEAU SOUS L'ICÔNE (PLUS PETIT) --- */
    .social-name {
      font-size: 0.45rem; /* Taille réduite comme demandé */
      font-weight: 700;
      color: var(--text-main);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      text-shadow: 0 1px 3px rgba(0,0,0,0.9);
      z-index: 2;
      transition: color 0.3s ease, text-shadow 0.3s ease;
      line-height: 1.2;
    }
    .link.social-link:hover .social-name {
      color: var(--card-border);
      text-shadow: 0 0 10px var(--glow-gold);
    }

    /* --- SÉPARATION EMAIL / DON --- */
    .email-separator {
      margin-top: 30px;
      padding-top: 20px;
      border-top: 2px dashed rgba(255, 215, 0, 0.3);
      display: flex;
      flex-direction: column;
      gap: 15px; /* Cet écart va espacer le bouton email et le bouton don */
      align-items: center; /* Centre les éléments horizontalement */
    }
    
    .email-separator .link {
      animation: fadeInUp 0.6s ease-out 1.3s forwards, cardFloat 6s ease-in-out infinite;
      width: 100%; /* Assure que le bouton email prend la largeur */
    }

    /* Style spécifique pour le bouton de don HiddenPay */
    .donate-btn-container {
      margin-top: 5px; /* Petit espace supplémentaire */
      animation: fadeInUp 0.6s ease-out 1.4s forwards;
      opacity: 0; /* Commence invisible, l'animation le fera apparaître */
    }
    .donate-btn-container img {
      transition: transform 0.3s ease, filter 0.3s ease;
      cursor: pointer;
    }
    .donate-btn-container img:hover {
      transform: scale(1.05);
      filter: drop-shadow(0 0 10px rgba(255, 215, 0, 0.6));
    }

    /* --- FOOTER --- */
    .footer {
      margin-top: 35px;
      font-size: 0.75rem;
      color: var(--text-sub);
      opacity: 0;
      animation: fadeInUp 0.8s ease-out 1.5s forwards;
    }
    
    [data-theme="light"] .container { background: rgba(255, 255, 255, 0.95); }
    [data-theme="light"] .link { color: #ffffff; }
    [data-theme="light"] h1 { text-shadow: none; }
  </style>
</head>
<body>

  <div class="container">
    <button class="theme-toggle" id="themeToggle" aria-label="Changer de thème"><i class="fas fa-sun"></i></button>

    <div class="avatar-wrapper">
      <img src="https://raw.githubusercontent.com/Bstudio136/mylink/main/1790505707078.jpg" alt="Avatar de Bstudio136" class="avatar">
    </div>

    <h1>Bstudio136</h1>
    <p class="username">@Bstudio136</p>
    <p class="bio">Bienvenue dans mon univers ! Découvrez mes projets et retrouvez-moi sur mes réseaux. 🚀</p>

    <!-- SECTION MES PROJETS -->
    <h2 class="section-title">🚀 Mes Projets</h2>
    <div class="links">
      <div class="link accordion-toggle" id="projectsToggle">
        <span class="icon"><i class="fas fa-folder-open"></i></span> 
        <span class="text">Voir mes projets</span>
        <span class="arrow"><i class="fas fa-chevron-down"></i></span>
      </div>
      
      <div class="projects-list" id="projectsList">
        <a href="https://bstudio136.github.io/BSuite/BSuite.html" class="link sub-link" target="_blank" rel="noopener">
          <span class="icon"><i class="fas fa-laptop-code"></i></span> 
          <span class="text">BSuite</span>
        </a>
        <a href="https://bstudio136.github.io/BSuite/index.html" class="link sub-link" target="_blank" rel="noopener">
          <span class="icon"><i class="fas fa-calculator"></i></span>
          <span class="text">Calc cache BSuite</span>
        </a>
      </div>
    </div>

    <!-- SECTION MES RÉSEAUX (GRILLE AVEC NOMS ET COULEURS DE MARQUE) -->
    <h2 class="section-title">🌐 Mes Réseaux</h2>
    <div class="social-grid">
      <a href="https://github.com/Bstudio136" class="link social-link social-github" target="_blank" rel="noopener">
        <span class="icon"><i class="fab fa-github"></i></span>
        <span class="social-name">GitHub</span>
      </a>
      <a href="https://tiktok.com/@bstudio136" class="link social-link social-tiktok" target="_blank" rel="noopener">
        <span class="icon"><i class="fab fa-tiktok"></i></span>
        <span class="social-name">TikTok</span>
      </a>
      <a href="https://x.com/Bstudio136" class="link social-link social-twitter" target="_blank" rel="noopener">
        <span class="icon"><i class="fab fa-x-twitter"></i></span>
        <span class="social-name">Twitter / X</span>
      </a>
      <a href="https://facebook.com/votre-pseudo" class="link social-link social-facebook" target="_blank" rel="noopener">
        <span class="icon"><i class="fab fa-facebook-f"></i></span>
        <span class="social-name">Facebook</span>
      </a>
      <a href="https://instagram.com/votre-pseudo" class="link social-link social-instagram" target="_blank" rel="noopener">
        <span class="icon"><i class="fab fa-instagram"></i></span>
        <span class="social-name">Instagram</span>
      </a>
      <a href="https://www.youtube.com/@Bstudio136" class="link social-link social-youtube" target="_blank" rel="noopener">
        <span class="icon"><i class="fab fa-youtube"></i></span>
        <span class="social-name">YouTube</span>
      </a>
    </div>

    <!-- SECTION EMAIL ET DON (SÉPARÉE) -->

      <!-- Bouton Email existant -->
      <a href="javascript:void(0)" class="link" id="emailBtn" onclick="copyEmail(event)">
        <span class="icon"><i class="fas fa-envelope"></i></span> 
        <span class="text" id="emailText">Copier l'Email</span>
      </a>

  <script>
    // --- GESTION DU THÈME ---
    const toggle = document.getElementById('themeToggle');
    const htmlElement = document.documentElement;
    
    const currentTheme = localStorage.getItem('theme') || 'dark';
    htmlElement.setAttribute('data-theme', currentTheme);
    updateThemeIcon(currentTheme);

    function updateThemeIcon(theme) {
      toggle.innerHTML = theme === 'dark' ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
    }

    toggle.addEventListener('click', () => {
      const theme = htmlElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      htmlElement.setAttribute('data-theme', theme);
      localStorage.setItem('theme', theme);
      updateThemeIcon(theme);
    });

    // --- GESTION DE L'ACCORDÉON PROJETS ---
    const projectsToggle = document.getElementById('projectsToggle');
    const projectsList = document.getElementById('projectsList');

    projectsToggle.addEventListener('click', () => {
      projectsToggle.classList.toggle('open');
      projectsList.classList.toggle('open');
    });

    // --- EFFET 3D TILT + ANIMATION AU CLIC ---
    if (window.matchMedia("(hover: hover)").matches) {
      const links = document.querySelectorAll('.link');
      
      links.forEach(link => {
        link.addEventListener('mousemove', (e) => {
          const rect = link.getBoundingClientRect();
          const x = e.clientX - rect.left;
          const y = e.clientY - rect.top;
          
          const centerX = rect.width / 2;
          const centerY = rect.height / 2;
          
          const intensity = link.classList.contains('social-link') ? 3 : 6;
          const rotateX = ((y - centerY) / centerY) * -intensity;
          const rotateY = ((x - centerX) / centerX) * intensity;
          
          link.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(1.03) translateY(-8px)`;
        });
        
        link.addEventListener('mouseleave', () => {
          link.style.transform = `perspective(1000px) rotateX(0deg) rotateY(0deg) scale(1) translateY(0)`;
          link.classList.remove('pressed');
        });

        link.addEventListener('mousedown', () => {
          if (link.id !== 'projectsToggle') link.classList.add('pressed');
        });
        link.addEventListener('mouseup', () => {
          link.classList.remove('pressed');
        });
        link.addEventListener('touchstart', () => {
          if (link.id !== 'projectsToggle') link.classList.add('pressed');
        }, {passive: true});
        link.addEventListener('touchend', () => {
          link.classList.remove('pressed');
        });
      });
    }

    // --- ANNEAU NÉON AU CLIC ---
    const allLinks = document.querySelectorAll('.link');
    allLinks.forEach(link => {
      link.addEventListener('click', function(e) {
        if (this.id === 'projectsToggle') return; 
        
        const rect = this.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        
        const ring = document.createElement('span');
        ring.classList.add('click-ring');
        
        const size = Math.max(rect.width, rect.height);
        ring.style.width = ring.style.height = `${size}px`;
        ring.style.left = `${x - size/2}px`;
        ring.style.top = `${y - size/2}px`;
        
        this.appendChild(ring);
        
        setTimeout(() => {
          ring.remove();
        }, 600);
      });
    });

    // --- FONCTION COPIER EMAIL ---
    function copyEmail(event) {
      event.preventDefault();
      const email = "sbavaytr@gmail.com"; // J'ai mis votre email ici au cas où
      
      navigator.clipboard.writeText(email).then(() => {
        const textElement = document.getElementById('emailText');
        const originalText = textElement.textContent;
        
        textElement.textContent = "Copié ! ✅";
        
        setTimeout(() => {
          textElement.textContent = originalText;
        }, 2000);
      }).catch(err => {
        console.error('Erreur lors de la copie : ', err);
      });
    }
  </script>
